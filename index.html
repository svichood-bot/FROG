.sheet{border:3px solid var(--go)}

 try{if(navigator.share){await navigator.share({title:'A fly for your frog',text,url});msg='🪰 Fly sent'+(name?' to '+ESC(name):'')+'!';return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(text+' '+url);msg='📋 Link copied. Paste it into a message to send your fly'}catch(e){msg='😕 Couldn’t share from here. Try the installed app'}}
