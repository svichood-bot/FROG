form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

.fl{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--mute)}
.sheet{border:3px solid var(--go)}

const buzz=()=>{const c=A();if(!c)return;try{const t=c.currentTime,o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter(),l=c.createOscillator(),lg=c.createGain(),am=c.createOscillator(),ag=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(200,t);o.frequency.linearRampToValueAtTime(270,t+.25);o.frequency.linearRampToValueAtTime(190,t+.6);l.frequency.value=7;lg.gain.value=22;l.connect(lg);lg.connect(o.frequency);am.frequency.value=48;ag.gain.value=.05;am.connect(ag);ag.connect(g.gain);fl.type='bandpass';fl.frequency.value=700;fl.Q.value=.8;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.06);g.gain.setValueAtTime(.12,t+.45);g.gain.exponentialRampToValueAtTime(.0001,t+.65);o.connect(fl);fl.connect(g);g.connect(c._m||c.destination);o.start(t);l.start(t);am.start(t);o.stop(t+.7);l.stop(t+.7);am.stop(t+.7)}catch(e){}};
const SFX={pal_tulip:()=>{[523,659,784,1047].forEach((f,i)=>bell(f,i*.11,.5))},
 pal_bee:()=>{buzz();[1319,1568].forEach((f,i)=>tone(f,.5+i*.12,.3,'sine',.05,6000))},

 pal_fly:()=>{[1319,1760,2093,1760,2349,2637].forEach((f,i)=>{tone(f,i*.055,.18,'triangle',.05,7000);tone(f*1.5,i*.055+.02,.12,'sine',.02,8000)})},

const voice=(type,f1,f2,t0,dur,vol,flt,fq,vib,q)=>{const c=A();if(!c)return;try{const t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur*.9);fl.type=flt||'lowpass';fl.frequency.value=fq||1500;fl.Q.value=q||1;let L=null;if(vib){L=c.createOscillator();const lg=c.createGain();L.frequency.value=vib[0];lg.gain.value=vib[1];L.connect(lg);lg.connect(o.frequency);L.start(t);L.stop(t+dur+.05)}g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.03,dur*.25));g.gain.setValueAtTime(vol,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(fl);fl.connect(g);g.connect(c._m||c.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}};
const gurgle=(f1,f2,t0,dur,vol,am,lp)=>{const c=A();if(!c)return;try{const t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter(),l=c.createOscillator(),lg=c.createGain(),m=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.type='lowpass';fl.frequency.value=lp||1100;fl.Q.value=2.5;l.frequency.value=am||40;lg.gain.value=.5;m.gain.value=.5;l.connect(lg);lg.connect(m.gain);o.connect(fl);fl.connect(m);m.connect(g);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.025);g.gain.setValueAtTime(vol,t+dur*.75);g.gain.exponentialRampToValueAtTime(.0001,t+dur);g.connect(c._m||c.destination);o.start(t);l.start(t);o.stop(t+dur+.05);l.stop(t+dur+.05)}catch(e){}};
const ribbit2=(t0,vol,pit)=>{const c=A();if(!c)return;try{[0,.15,.33].forEach((d,k)=>{const t=c.currentTime+t0+d,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter(),l=c.createOscillator(),lg=c.createGain();o.type='square';o.frequency.setValueAtTime((k==2?170:250)*pit,t);o.frequency.exponentialRampToValueAtTime((k==2?95:125)*pit,t+.12);l.frequency.value=46;lg.gain.value=vol*.7;l.connect(lg);lg.connect(g.gain);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.14);f.type='lowpass';f.frequency.value=900;o.connect(f);f.connect(g);g.connect(c._m||c.destination);o.start(t);l.start(t);o.stop(t+.16);l.stop(t+.16)})}catch(e){}};
